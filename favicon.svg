<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Film reel icon for Course Gallery -->
  <rect x="6" y="8" width="52" height="48" rx="5" fill="#0e1d42"/>
  <!-- Top & bottom sprocket strips -->
  <rect x="6" y="8" width="52" height="9" rx="2" fill="#1a356b"/>
  <rect x="6" y="47" width="52" height="9" rx="2" fill="#1a356b"/>
  <!-- Sprocket holes -->
  <g fill="#d5dae8">
    <rect x="11" y="11" width="6" height="4" rx="1"/>
    <rect x="22" y="11" width="6" height="4" rx="1"/>
    <rect x="33" y="11" width="6" height="4" rx="1"/>
    <rect x="44" y="11" width="6" height="4" rx="1"/>
    <rect x="11" y="50" width="6" height="4" rx="1"/>
    <rect x="22" y="50" width="6" height="4" rx="1"/>
    <rect x="33" y="50" width="6" height="4" rx="1"/>
    <rect x="44" y="50" width="6" height="4" rx="1"/>
  </g>
  <!-- Center film frame -->
  <rect x="16" y="22" width="32" height="20" rx="2" fill="#3a66ae"/>
  <!-- Reel core hint in the frame -->
  <circle cx="32" cy="32" r="6" fill="none" stroke="#d5dae8" stroke-width="2"/>
  <circle cx="32" cy="32" r="2" fill="#d5dae8"/>
</svg>
